[package]
name = "vibrium-adblock"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Privacy-focused content blocking engine for the Vibrium browser"

[lib]
name = "vibrium_adblock"
crate-type = ["rlib", "staticlib"]

[dependencies]
url = "2"
adblock = { path = "../adblock-rust" }

[dev-dependencies]
tiny_http = "0.12"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] } 