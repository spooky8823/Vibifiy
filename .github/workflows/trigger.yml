name: Vibifiy App Dispatcher

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest

    outputs:
      vibipass: ${{ steps.filter.outputs.vibipass }}
      vibrium: ${{ steps.filter.outputs.vibrium }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            vibipass:
              - 'VibiPass/**'

            vibrium:
              - 'Vibrium/**'

  build-vibipass:
    name: Build VibiPass
    needs: detect-changes
    if: needs.detect-changes.outputs.vibipass == 'true'
    uses: ./.github/workflows/vibipass.yml
    permissions:
      contents: write

  build-vibrium:
    name: Build Vibrium
    needs: detect-changes
    if: needs.detect-changes.outputs.vibrium == 'true'
    uses: ./.github/workflows/vibrium.yml
    permissions:
      contents: write
