name: Validate Vibrium

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibrium-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust ad-blocker tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Vibrium/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

  chromium-metadata:
    name: Validate Chromium baseline and patches
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate pinned Chromium revision
        shell: bash
        run: |
          set -euo pipefail

          revision_file="Vibrium/chromium/revision.txt"
          test -s "$revision_file"

          revision="$(sed -n 's/^REVISION=//p' "$revision_file" | tr -d '\r')"
          version="$(sed -n 's/^VERSION=//p' "$revision_file" | tr -d '\r')"
          status="$(sed -n 's/^STATUS=//p' "$revision_file" | tr -d '\r')"

          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Chromium revision must be a full 40-character Git commit hash."
            exit 1
          fi

          if [[ -z "$version" || "$status" != "PINNED" ]]; then
            echo "::error::Chromium version is missing or the baseline is not pinned."
            exit 1
          fi

          {
            echo "## Chromium baseline"
            echo "- Version: $version"
            echo "- Revision: $revision"
            echo "- Status: $status"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate patch series
        shell: bash
        run: |
          set -euo pipefail

          patch_dir="Vibrium/chromium/patches"
          series="$patch_dir/series"

          test -s "$series"

          count=0

          while IFS= read -r patch || [[ -n "$patch" ]]; do
            patch="${patch%$'\r'}"

            [[ -z "$patch" || "$patch" == \#* ]] && continue

            if [[ "$patch" == */* || "$patch" == *..* ]]; then
              echo "::error::Invalid patch filename in series: $patch"
              exit 1
            fi

            file="$patch_dir/$patch"

            if [[ ! -f "$file" ]]; then
              echo "::error::Patch listed in series is missing: $patch"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "::error::Patch listed in series is empty: $patch"
              exit 1
            fi

            count=$((count + 1))
            echo "Found patch: $patch"
          done < "$series"

          if [[ "$count" -eq 0 ]]; then
            echo "::error::Patch series contains no patches."
            exit 1
          fi

          echo "Validated $count patch file(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibrium-validation-report
          path: |
            Vibrium/chromium/revision.txt
            Vibrium/chromium/patches/series
            Vibrium/chromium/patches/*.patch
          if-no-files-found: warn
          retention-days: 7
