name: Build Vibrium

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential python3 python3-pip python3-venv \
            mercurial libgtk-3-dev libdbus-glib-1-dev \
            libpulse-dev libasound2-dev libxt-dev \
            libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev \
            yasm nasm zip unzip dpkg-dev fakeroot curl

      - name: Bundle uBlock Origin
        working-directory: Vibrium
        run: |
          mkdir -p extensions
          UBO_VERSION="1.75.0"
          UBO_URL="https://github.com/gorhill/uBlock/releases/download/${UBO_VERSION}/uBlock0_${UBO_VERSION}.firefox.signed.xpi"
          echo "Downloading uBO from: $UBO_URL"
          curl -L -f -o "extensions/uBlock0@raymondhill.net.xpi" "$UBO_URL"
          ls -la extensions/

      - name: Install GeckoKit
        working-directory: Vibrium
        run: npm install

      - name: GeckoKit setup (Linux)
        working-directory: Vibrium
        run: |
          set -e
          npx geckokit setup
        env:
          GECKOKIT_ACCEPT_LICENSE: "1"

      - name: Build Vibrium (Linux)
        working-directory: Vibrium
        run: |
          set -e
          npx geckokit build

      - name: Package (Linux)
        working-directory: Vibrium
        run: |
          set -e
          npx geckokit package
          mkdir -p dist
          cp -r .geckokit/firefox/obj-geckokit-*/dist/* dist/ || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibrium-linux
          path: Vibrium/dist/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\MozillaBuildSetup.exe"
          Start-Process -FilePath "$env:TEMP\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
          echo "C:\mozilla-build\msys2\usr\bin" >> $env:GITHUB_PATH
          echo "C:\mozilla-build\python3\bin" >> $env:GITHUB_PATH

      - name: Bundle uBlock Origin
        working-directory: Vibrium
        shell: bash
        run: |
          mkdir -p extensions
          UBO_VERSION="1.75.0"
          UBO_URL="https://github.com/gorhill/uBlock/releases/download/${UBO_VERSION}/uBlock0_${UBO_VERSION}.firefox.signed.xpi"
          echo "Downloading uBO from: $UBO_URL"
          curl -L -f -o "extensions/uBlock0@raymondhill.net.xpi" "$UBO_URL"
          ls -la extensions/

      - name: Install GeckoKit
        working-directory: Vibrium
        run: npm install

      - name: GeckoKit setup (Windows)
        working-directory: Vibrium
        shell: powershell
        run: |
          echo "Starting GeckoKit Setup..."
          npx geckokit setup
          echo "GeckoKit Setup Finished!"
        env:
          GECKOKIT_ACCEPT_LICENSE: "1"
          MOZILLABUILD: "C:\mozilla-build"

      - name: Build Vibrium (Windows)
        working-directory: Vibrium
        shell: powershell
        run: |
          echo "Starting GeckoKit Build..."
          npx geckokit build
          echo "GeckoKit Build Finished!"

      - name: Package (Windows)
        working-directory: Vibrium
        shell: powershell
        run: |
          echo "Starting GeckoKit Package..."
          npx geckokit package
          echo "Package Finished!"
          
          echo "Checking for output directories..."
          if (Test-Path -Path ".geckokit\firefox\obj-geckokit-*\dist") {
            Write-Host "Found dist folder!"
            New-Item -ItemType Directory -Force -Path "dist"
            Copy-Item -Path ".geckokit\firefox\obj-geckokit-*\dist\*" -Destination "dist" -Recurse -Force
          } else {
            Write-Host "ERROR: Could not find GeckoKit build output!"
            Get-ChildItem -Path . -Depth 3 -Directory | Select-Object FullName
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibrium-windows
          path: Vibrium/dist/
          retention-days: 30
