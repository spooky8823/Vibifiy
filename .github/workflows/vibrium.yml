name: Build Vibrium

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential python3 python3-pip python3-venv \
            mercurial libgtk-3-dev libdbus-glib-1-dev \
            libpulse-dev libasound2-dev libxt-dev \
            libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev \
            yasm nasm zip unzip dpkg-dev fakeroot curl

      - name: Bundle uBlock Origin
        working-directory: Vibrium
        run: |
          mkdir -p extensions
          UBO_VERSION="1.75.0"
          UBO_URL="https://github.com/gorhill/uBlock/releases/download/${UBO_VERSION}/uBlock0_${UBO_VERSION}.firefox.signed.xpi"
          echo "Downloading uBO from: $UBO_URL"
          curl -L -f -o "extensions/uBlock0@raymondhill.net.xpi" "$UBO_URL"
          ls -la extensions/

      - name: Install GeckoKit
        working-directory: Vibrium
        run: npm install

      - name: GeckoKit setup
        working-directory: Vibrium
        run: npx geckokit setup
        env:
          GECKOKIT_ACCEPT_LICENSE: "1"

      - name: Build Vibrium
        working-directory: Vibrium
        run: npx geckokit build

      - name: Package (Linux)
        working-directory: Vibrium
        run: |
          npx geckokit package
          mkdir -p dist
          cp -r .geckokit/firefox/obj-geckokit-*/dist/* dist/ || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibrium-linux
          path: Vibrium/dist/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\MozillaBuildSetup.exe"
          Start-Process -FilePath "$env:TEMP\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
          echo "C:\mozilla-build" >> $env:GITHUB_PATH

      - name: Bundle uBlock Origin
        working-directory: Vibrium
        shell: bash
        run: |
          mkdir -p extensions
          UBO_VERSION="1.75.0"
          UBO_URL="https://github.com/gorhill/uBlock/releases/download/${UBO_VERSION}/uBlock0_${UBO_VERSION}.firefox.signed.xpi"
          echo "Downloading uBO from: $UBO_URL"
          curl -L -f -o "extensions/uBlock0@raymondhill.net.xpi" "$UBO_URL"
          ls -la extensions/

      - name: Install GeckoKit
        working-directory: Vibrium
        run: npm install

      - name: GeckoKit setup (Windows)
        working-directory: Vibrium
        shell: cmd
        run: |
          call C:\mozilla-build\start-shell.bat -c "cd /c/actions-runner/_work/Vibifiy/Vibifiy/Vibrium && npx geckokit setup"
        env:
          GECKOKIT_ACCEPT_LICENSE: "1"

      - name: Build Vibrium (Windows)
        working-directory: Vibrium
        shell: cmd
        run: |
          call C:\mozilla-build\start-shell.bat -c "cd /c/actions-runner/_work/Vibifiy/Vibifiy/Vibrium && npx geckokit build"

      - name: Package (Windows)
        working-directory: Vibrium
        shell: cmd
        run: |
          call C:\mozilla-build\start-shell.bat -c "cd /c/actions-runner/_work/Vibifiy/Vibifiy/Vibrium && npx geckokit package"
          mkdir dist
          xcopy /E /I /Y ".geckokit\firefox\obj-geckokit-*\dist" "dist"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibrium-windows
          path: Vibrium/dist/
          retention-days: 30