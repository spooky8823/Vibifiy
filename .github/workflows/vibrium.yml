name: Build Vibrium Snapshot

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vibrium Snapshot
    runs-on: windows-latest

    env:
      CEF_ARCHIVE: cef_binary_154.0.34+g14c5a08+chromium-154.0.8037.98_windows64.tar.bz2
      CEF_ROOT: ${{ github.workspace }}/Vibrium/third_party/cef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Download CEF
        shell: pwsh
        run: |
          $url = "https://cef-builds.spotifycdn.com/$env:CEF_ARCHIVE"
          $archive = Join-Path $env:RUNNER_TEMP $env:CEF_ARCHIVE

          curl.exe -L --fail --retry 3 "$url" -o "$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "CEF download failed."
          }

      - name: Extract CEF
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:CEF_ARCHIVE
          $temp = Join-Path $env:RUNNER_TEMP "cef-extracted"

          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          tar.exe -xjf "$archive" -C "$temp"

          if ($LASTEXITCODE -ne 0) {
            throw "CEF extraction failed."
          }

          $cef = Get-ChildItem $temp -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "CMakeLists.txt") } |
            Select-Object -First 1

          if (!$cef) {
            throw "CEF CMakeLists.txt was not found."
          }

          New-Item -ItemType Directory -Force `
            -Path "Vibrium/third_party" | Out-Null

          if (Test-Path $env:CEF_ROOT) {
            Remove-Item $env:CEF_ROOT -Recurse -Force
          }

          Move-Item $cef.FullName $env:CEF_ROOT

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S Vibrium -B Vibrium/build -A x64 `
            "-DCEF_ROOT=$env:CEF_ROOT"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Compile Vibrium
        shell: pwsh
        run: |
          cmake --build Vibrium/build --config Release --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Vibrium compilation failed."
          }

      - name: Package snapshot
        shell: pwsh
        run: |
          $package = "Vibrium_snapshot2026-10-31"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $exe = Get-ChildItem "Vibrium/build" -Filter "vibrium.exe" -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "vibrium.exe was not found."
          }

          Copy-Item $exe.FullName $package

          foreach ($directory in @("Release", "Resources")) {
            $source = Join-Path $env:CEF_ROOT $directory

            if (!(Test-Path $source)) {
              throw "CEF runtime directory missing: $source"
            }

            Copy-Item "$source/*" $package -Recurse -Force
          }

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "$package.zip" `
            -Force

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibrium_snapshot2026-10-31
          path: Vibrium_snapshot2026-10-31.zip
          if-no-files-found: error
          retention-days: 30